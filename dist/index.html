<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DERIVA — Longboard en la Quebrada</title><meta name="description" content="Bajá la cuesta hasta el pueblo. Encontrá tu línea. Un juego de longboard en Three.js inspirado en la Quebrada de Humahuaca."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2321322d'/%3E%3Cpath d='M9 30 20 8 31 30Z' fill='%23d8ef85'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="collection.css"></head><body>
<div id="world"></div><div class="grain"></div>
<header><a class="brand" href="./" aria-label="Deriva inicio"><span class="mark">◭</span> DERIVA<span class="edition">LONGBOARD CLUB</span></a><div class="loot glass" role="status" aria-label="Botín de esta bajada"><span title="Pancho: 100 puntos"><i aria-hidden="true">🌭</i><b id="count-pancho">0</b><em class="sr">panchos</em></span><span title="Disco: 200 puntos"><i aria-hidden="true">💿</i><b id="count-disco">0</b><em class="sr">discos</em></span><span title="Sticker: 150 puntos"><i aria-hidden="true">✳</i><b id="count-sticker">0</b><em class="sr">stickers</em></span><p id="collection-hint" class="sr">Uno de cada uno = +250 de combo</p></div><div class="topright"><button class="glass icon" id="garage-open" aria-label="Elegir rider y tabla" title="Rider y tabla"><span aria-hidden="true">☻</span></button><button class="glass icon" id="lens" aria-label="Cambiar cámara" title="Cámara"><span aria-hidden="true">◎</span></button><button class="glass icon off" id="sound" aria-label="Sonido" aria-pressed="false" title="Sonido"><span aria-hidden="true">♪</span></button><button class="glass icon" id="pause" aria-label="Pausar" title="Pausa"><span aria-hidden="true">Ⅱ</span></button></div></header>




<div id="message" role="status"></div>
<section id="modal" class="modal glass" hidden><span class="eyebrow" id="modal-kicker">TOMATE UN RESPIRO</span><h2 id="modal-title">En pausa.</h2><p id="modal-copy">La cuesta te espera.</p><button class="primary" id="resume">SEGUIR RODANDO ↗</button><button class="text-button" id="restart">VOLVER A EMPEZAR</button></section>
<footer><div class="keys glass" aria-label="Controles"><span><kbd>←</kbd><kbd>→</kbd> carving</span><span><kbd>↑</kbd> impulso</span><span><kbd>espacio</kbd> freno</span><span><kbd>P</kbd> pausa</span></div><div class="meter glass" role="status" aria-label="Velocidad y distancia"><span><b id="speed">00</b> km/h</span><span><b id="distance">0 m</b></span></div><span id="score" hidden>0000</span></footer>
<div class="touch"><div class="pad"><button class="glass" data-key="ArrowLeft" aria-label="Girar a la izquierda"><span aria-hidden="true">←</span></button><button class="glass" data-key="ArrowRight" aria-label="Girar a la derecha"><span aria-hidden="true">→</span></button></div><div class="pad"><button class="glass brake" data-key="Space" aria-label="Frenar"><span aria-hidden="true">FRENO</span></button><button class="glass push" data-key="ArrowUp" aria-label="Impulso"><span aria-hidden="true">↑</span><em>IMPULSO</em></button></div></div><script type="module" src="game.js"></script></body></html>
